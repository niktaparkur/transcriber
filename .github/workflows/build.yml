name: Build Idus Transcriber for Windows

on:
  push:
    branches: ["main", "master"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Скачиваем и собираем CrispASR (Движок)
      - name: Clone CrispASR
        run: git clone --recursive https://github.com/CrispStrobe/CrispASR.git crispasr-src

      - name: Cache CrispASR Build
        uses: actions/cache@v4
        with:
          path: crispasr-src/build
          key: ${{ runner.os }}-crispasr-${{ hashFiles('crispasr-src/**/*.cpp', 'crispasr-src/**/*.h', 'crispasr-src/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-crispasr-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile CrispASR
        working-directory: ./crispasr-src
        shell: cmd
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 2
          mkdir ..\bin
          :: Находим crispasr.exe, копируем его и ВСЕ .dll файлы из той же папки
          for /R build %%i in (crispasr.exe) do if exist "%%i" (
            copy "%%i" ..\bin\
            xcopy /Y "%%~dpi*.dll" ..\bin\
          )

      # 2. Собираем Python GUI
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyQt6 App
        run: pyinstaller --noconfirm --onedir --windowed --name "IdusTranscriber" main.py

      # 3. Формируем финальный архив
      - name: Prepare Final Release Folder
        shell: cmd
        run: |
          mkdir Release
          xcopy /E /I dist\IdusTranscriber Release\IdusTranscriber
          mkdir Release\IdusTranscriber\bin
          mkdir Release\IdusTranscriber\models
          :: Копируем абсолютно ВСЕ файлы из bin (включая собранные .dll) в релиз
          xcopy /Y bin\* Release\IdusTranscriber\bin\
          echo Place parakeet-tdt-0.6b-v3-q8_0.gguf here > Release\IdusTranscriber\models\PUT_MODEL_HERE.txt

      # 4. Загружаем Артефакт на GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdusTranscriber-Windows
          path: Release/IdusTranscriber/
